<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 212" role="img" aria-label="Each level up closes one more anomaly" font-size="13"><defs><marker id="ladder-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-line)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--dg-ink)">Each level up closes one more anomaly</text><rect x="20" y="60" width="164" height="88" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="32" y="84" font-weight="600" fill="var(--dg-ink)">Read Uncommitted</text><text x="32" y="104" font-size="11.5" fill="var(--dg-ink)">Stops: nothing</text><text x="32" y="120" font-size="11.5" fill="var(--dg-quiet)">Postgres treats it</text><text x="32" y="136" font-size="11.5" fill="var(--dg-quiet)">as Read Committed</text><rect x="204" y="60" width="164" height="88" rx="8" fill="var(--dg-c1)" fill-opacity="0.12" stroke="var(--dg-c1)" stroke-width="2"></rect><text x="216" y="84" font-weight="600" fill="var(--dg-ink)">Read Committed</text><text x="216" y="104" font-size="11.5" fill="var(--dg-ink)">Stops: dirty reads</text><text x="216" y="120" font-size="11.5" fill="var(--dg-quiet)">Snapshot per statement</text><text x="216" y="136" font-size="11.5" fill="var(--dg-quiet)">Postgres default</text><rect x="388" y="60" width="164" height="88" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="400" y="84" font-weight="600" fill="var(--dg-ink)">Repeatable Read</text><text x="400" y="104" font-size="11.5" fill="var(--dg-ink)">Stops: non-repeatable</text><text x="400" y="120" font-size="11.5" fill="var(--dg-ink)">reads and phantoms</text><text x="400" y="136" font-size="11.5" fill="var(--dg-quiet)">One snapshot per tx</text><rect x="572" y="60" width="164" height="88" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="584" y="84" font-weight="600" fill="var(--dg-ink)">Serializable</text><text x="584" y="104" font-size="11.5" fill="var(--dg-ink)">Stops: write skew</text><text x="584" y="120" font-size="11.5" fill="var(--dg-quiet)">Aborts unsafe commits</text><text x="584" y="136" font-size="11.5" fill="var(--dg-quiet)">Needs retry logic</text><path d="M20 172H736" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-end="url(#ladder-arrow)"></path><text x="20" y="194" font-size="11.5" fill="var(--dg-quiet)">Weaker</text><text x="736" y="194" text-anchor="end" font-size="11.5" fill="var(--dg-quiet)">Stronger, with more waiting and retries</text></svg>
