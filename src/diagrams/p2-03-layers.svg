<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Metadata and bytes live in separate systems" font-size="13"><defs><marker id="s3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-line)"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="var(--dg-ink)">Metadata and bytes live in separate systems</text><g fill="none" stroke="var(--dg-line)" stroke-width="1.25"><path d="M160 110H214" marker-end="url(#s3-arrow)"></path><path d="M456 110H494" marker-end="url(#s3-arrow)"></path><path d="M336 150V198" marker-end="url(#s3-arrow)"></path></g><text x="188" y="100" text-anchor="middle" font-size="11" fill="var(--dg-quiet)">PUT/GET</text><text x="476" y="60" text-anchor="middle" font-size="11.5" fill="var(--dg-quiet)">lookup / update</text><text x="346" y="180" font-size="11.5" fill="var(--dg-quiet)">write / read chunks</text><g><rect x="24" y="86" width="136" height="48" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="92" y="114" text-anchor="middle" font-weight="600" fill="var(--dg-ink)">Client / SDK</text></g><g><rect x="216" y="70" width="240" height="80" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="232" y="94" font-weight="600" fill="var(--dg-ink)">Front end (stateless)</text><text x="232" y="114" font-size="11.5" fill="var(--dg-quiet)">Auth and routing, in every AZ</text><text x="232" y="132" font-size="11.5" fill="var(--dg-quiet)">Erasure-codes the object</text></g><g><rect x="496" y="70" width="240" height="80" rx="8" fill="var(--dg-c1)" fill-opacity="0.12" stroke="var(--dg-c1)" stroke-width="2"></rect><text x="512" y="94" font-weight="600" fill="var(--dg-ink)">Metadata index</text><text x="512" y="114" font-size="11.5" fill="var(--dg-ink)">bucket + key to chunk locations</text><text x="512" y="132" font-size="11.5" fill="var(--