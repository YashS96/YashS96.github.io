<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="A filesystem is a mutable tree; an object store is a flat map of immutable blobs" font-size="13"><text x="24" y="32" font-size="15" font-weight="600" fill="var(--dg-ink)">A filesystem is a mutable tree; an object store is a flat map</text><g><rect x="24" y="52" width="344" height="228" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="40" y="78" font-weight="600" fill="var(--dg-ink)">Filesystem: a tree of inodes</text></g><g fill="none" stroke="var(--dg-line)" stroke-width="1.25"><path d="M56 126V150H80"></path><path d="M96 166V190H120"></path><path d="M136 206V230H160"></path></g><g><rect x="40" y="98" width="128" height="28" rx="6" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><rect x="80" y="136" width="128" height="28" rx="6" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><rect x="120" y="176" width="128" height="28" rx="6" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><rect x="160" y="216" width="128" height="28" rx="6" fill="var(--dg-c1)" fill-opacity="0.12" stroke="var(--dg-c1)" stroke-width="1.5"></rect><text x="52" y="117" font-size="11.5" fill="var(--dg-ink)">/</text><text x="92" y="155" font-size="11.5" fill="var(--dg-ink)">photos/</text><text x="132" y="195" font-size="11.5" fill="var(--dg-ink)">2026/</text><text x="172" y="235" font-size="11.5" fill="var(--dg-ink)">cat.jpg</text><text x="40" y="266" font-size="11.5" fill="var(--dg-quiet)">every level is a real directory inode</text></g><g><rect x="392" y="52" width="344" height="228" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="408" y="78" font-weight="600" fill="var(--dg-ink)">Object store: bucket of flat keys</text></g><g><rect x="408" y="98" width="312" height="28" rx="6" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><rect x="408" y="136" width="312" height="28" rx="6" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><rect x="408" y="174" width="312" height="28" rx="6" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><rect x="408" y="212" width="312" height="28" rx="6" fill="var(--dg-c1)" fill-opacity="0.12" stroke="var(--dg-c1)" stroke-width="1.5"></rect><text x="420" y="117" font-size="11.5" fill="var(--dg-ink)">logs/2026-10-17.log  to  blob + metadata</text><text x="420" y="155" font-size="11.5" fill="var(--dg-ink)">photos/2026/cat.jpg  to  blob + metadata</text><text x="420" y="193" font-size="11.5" fill="var(--dg-ink)">photos/2026/dog.jpg  to  blob + metadata</text><text x="420" y="231" font-size="11.5" fill="var(--dg-ink)">new PUT of cat.jpg: new blob, key swapped</text><text x="408" y="266" font-size="11.5" fill="var(--dg-quiet)">slashes are just characters; keys kept sorted</text></g><text x="24" y="304" font-size="11.5" fill="var(--dg-ink)">Mutable: seek and overwrite byte 5,000.</text><text x="24" y="322" font-size="11.5" fill="var(--dg-quiet)">Rename a folder = one cheap inode change.</text><text x="392" y="304" font-size="11.5" fill="var(--dg-ink)">Immutable: replace the whole object.</text><text x="392" y="322" font-size="11.5" fill="var(--dg-quiet)">Rename a prefix = copy every object under it.</text></svg>
