<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" role="img" aria-label="Sockets wait on readiness, files wait on a worker thread" font-size="13"><defs><marker id="ep-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-line)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--dg-ink)">Sockets wait on readiness; files wait on a worker thread</text><g><rect x="24" y="56" width="712" height="48" rx="8" fill="var(--dg-c1)" fill-opacity="0.12" stroke="var(--dg-c1)" stroke-width="2"></rect><text x="380" y="84" text-anchor="middle" font-weight="600" fill="var(--dg-ink)">Event loop (one thread): never blocks, only reacts to events</text></g><g><path d="M132 106V138" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-start="url(#ep-arrow)" marker-end="url(#ep-arrow)"></path><path d="M380 106V138" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-start="url(#ep-arrow)" marker-end="url(#ep-arrow)"></path><path d="M628 106V138" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-start="url(#ep-arrow)" marker-end="url(#ep-arrow)"></path><path d="M132 246V274" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-start="url(#ep-arrow)" marker-end="url(#ep-arrow)"></path><path d="M380 246V274" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-start="url(#ep-arrow)" marker-end="url(#ep-arrow)"></path><path d="M628 246V274" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-start="url(#ep-arrow)" marker-end="url(#ep-arrow)"></path></g><g><line x1="24" x2="736" y1="260" y2="260" stroke="var(--dg-line)" stroke-width="1" stroke-dasharray="5 4"></line><text x="736" y="254" text-anchor="end" font-size="11" fill="var(--dg-quiet)">kernel</text></g><g><rect x="24" y="140" width="216" height="104" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="40" y="164" font-weight="600" fill="var(--dg-ink)">Sockets: epoll</text><text x="40" y="180" font-size="11.5" fill="var(--dg-quiet)">fd set to non-blocking</text><text x="40" y="196" font-size="11.5" fill="var(--dg-quiet)">epoll_wait: kernel says which</text><text x="40" y="212" font-size="11.5" fill="var(--dg-quiet)">sockets have data ready</text><text x="40" y="228" font-size="11.5" fill="var(--dg-quiet)">so read() never blocks</text></g><g><rect x="272" y="140" width="216" height="104" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="288" y="164" font-weight="600" fill="var(--dg-ink)">Files: thread pool</text><text x="288" y="180" font-size="11.5" fill="var(--dg-quiet)">epoll can&#x27;t help: a regular</text><text x="288" y="196" font-size="11.5" fill="var(--dg-quiet)">file is always reported ready</text><text x="288" y="212" font-size="11.5" fill="var(--dg-quiet)">libuv runs blocking read()</text><text x="288" y="228" font-size="11.5" fill="var(--dg-quiet)">on 4 worker threads (default)</text></g><g><rect x="520" y="140" width="216" height="104" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="536" y="164" font-weight="600" fill="var(--dg-ink)">io_uring (Linux 5.1+)</text><text x="536" y="180" font-size="11.5" fill="var(--dg-quiet)">App fills a submission ring</text><text x="536" y="196" font-size="11.5" fill="var(--dg-quiet)">Kernel does the I/O async</text><text x="536" y="212" font-size="11.5" fill="var(--dg-quiet)">Results land on completion ring</text><text x="536" y="228" font-size="11.5" fill="var(--dg-quiet)">True async files, few syscalls</text></g><g><rect x="24" y="276" width="216" height="44" rx="8" fill="var(--dg-tint)" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="132" y="302" text-anchor="middle" font-size="11.5" fill="var(--dg-ink)">TCP stack + socket buffers</text></g><g><rect x="272" y="276" width="216" height="44" rx="8" fill="var(--dg-tint)" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="380" y="302" text-anchor="middle" font-size="11.5" fill="var(--dg-ink)">VFS, page cache, disk</text></g><g><rect x="520" y="276" width="216" height="44" rx="8" fill="var(--dg-tint)" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="628" y="302" text-anchor="middle" font-size="11.5" fill="var(--dg-ink)">Shared rings, kernel workers</text></g></svg>
