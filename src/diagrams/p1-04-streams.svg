<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" role="img" aria-label="Streams keep memory flat by pausing the reader" font-size="13"><defs><marker id="st-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-line)"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="var(--dg-ink)">Streams keep memory flat by pausing the reader</text><g fill="none" stroke="var(--dg-line)" stroke-width="1.25"><path d="M176 104H230" marker-end="url(#st-arrow)"></path><path d="M464 104H518" marker-end="url(#st-arrow)"></path><path d="M176 204H230" marker-end="url(#st-arrow)"></path><path d="M464 204H518" marker-end="url(#st-arrow)"></path><path d="M628 232V256H348V234" marker-end="url(#st-arrow)"></path></g><text x="24" y="66" font-size="11.5" font-weight="600" fill="var(--dg-quiet)">readFile()</text><text x="24" y="166" font-size="11.5" font-weight="600" fill="var(--dg-quiet)">createReadStream().pipe()</text><g><rect x="24" y="76" width="152" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="100" y="108" text-anchor="middle" font-weight="600" fill="var(--dg-ink)">Disk</text></g><g><rect x="232" y="76" width="232" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="248" y="100" font-weight="600" fill="var(--dg-ink)">Loop read() until EOF</text><text x="248" y="118" font-size="11.5" fill="var(--dg-quiet)">whole file into one Buffer</text></g><g><rect x="520" y="76" width="216" height="56" rx="8" fill="var(--dg-bad)" fill-opacity="0.12" stroke="var(--dg-bad)" stroke-width="2"></rect><text x="536" y="100" font-weight="600" fill="var(--dg-ink)">Memory = file size</text><text x="536" y="118" font-size="11.5" fill="var(--dg-ink)">5 GB file, 5 GB heap, OOM</text></g><g><rect x="24" y="176" width="152" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="100" y="208" text-anchor="middle" font-weight="600" fill="var(--dg-ink)">Disk</text></g><g><rect x="232" y="176" width="232" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="248" y="200" font-weight="600" fill="var(--dg-ink)">Readable stream</text><text x="248" y="218" font-size="11.5" fill="var(--dg-quiet)">64 KB chunks (highWaterMark)</text></g><g><rect x="520" y="176" width="216" height="56" rx="8" fill="var(--dg-good)" fill-opacity="0.12" stroke="var(--dg-good)" stroke-width="2"></rect><text x="536" y="200" font-weight="600" fill="var(--dg-ink)">Writable: socket, upload</text><text x="536" y="218" font-size="11.5" fill="var(--dg-ink)">memory stays roughly flat</text></g><text x="488" y="280" text-anchor="middle" font-size="11.5" fill="var(--dg-quiet)">write() returns false: pause reading. &#x27;drain&#x27; event: resume.</text></svg>
