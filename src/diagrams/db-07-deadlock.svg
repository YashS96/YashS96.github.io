<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Opposite lock order deadlocks; one fixed order just queues" font-size="13"><defs><marker id="dl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-line)"></path></marker><marker id="dl-wait" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-bad)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--dg-ink)">Opposite lock order deadlocks; one fixed order just queues</text><text x="40" y="72" font-weight="600" fill="var(--dg-ink)">Opposite order: deadlock</text><rect x="40" y="92" width="120" height="40" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="100" y="116" text-anchor="middle" fill="var(--dg-ink)">Batch X</text><rect x="40" y="212" width="120" height="40" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="100" y="236" text-anchor="middle" fill="var(--dg-ink)">Batch Y</text><rect x="224" y="92" width="120" height="40" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="284" y="116" text-anchor="middle" fill="var(--dg-ink)">Row 1</text><rect x="224" y="212" width="120" height="40" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="284" y="236" text-anchor="middle" fill="var(--dg-ink)">Row 2</text><g fill="none" stroke-width="1.25"><path d="M160 112H224" stroke="var(--dg-line)" marker-end="url(#dl-arrow)"></path><path d="M160 232H224" stroke="var(--dg-line)" marker-end="url(#dl-arrow)"></path><path d="M160 132L224 212" stroke="var(--dg-bad)" stroke-dasharray="4 4" marker-end="url(#dl-wait)"></path><path d="M160 212L224 132" stroke="var(--dg-bad)" stroke-dasharray="4 4" marker-end="url(#dl-wait)"></path></g><text x="192" y="104" text-anchor="middle" font-size="11.5" fill="var(--dg-quiet)">holds</text><text x="192" y="224" text-anchor="middle" font-size="11.5" fill="var(--dg-quiet)">holds</text><text x="192" y="284" text-anchor="middle" font-size="11.5" fill="var(--dg-quiet)">Each waits for the other, forever</text><text x="412" y="72" font-weight="600" fill="var(--dg-ink)">Same order (ORDER BY id): queue</text><rect x="412" y="92" width="120" height="40" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="472" y="116" text-anchor="middle" fill="var(--dg-ink)">Batch X</text><rect x="412" y="212" width="120" height="40" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="472" y="236" text-anchor="middle" fill="var(--dg-ink)">Batch Y</text><rect x="596" y="92" width="120" height="40" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="656" y="116" text-anchor="middle" fill="var(--dg-ink)">Row 1</text><rect x="596" y="212" width="120" height="40" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="656" y="236" text-anchor="middle" fill="var(--dg-ink)">Row 2</text><g fill="none" stroke="var(--dg-line)" stroke-width="1.25"><path d="M532 112H596" marker-end="url(#dl-arrow)"></path><path d="M532 132L596 212" marker-end="url(#dl-arrow)"></path><path d="M532 212L596 132" stroke-dasharray="4 4" marker-end="url(#dl-arrow)"></path></g><text x="564" y="104" text-anchor="middle" font-size="11.5" fill="var(--dg-quiet)">holds</text><text x="564" y="284" text-anchor="middle" font-size="11.5" fill="var(--dg-quiet)">Y waits on row 1, runs after X commits</text><text x="24" y="320" font-size="11.5" fill="var(--dg-quiet)">Solid: lock held. Dashed: waiting for a lock.</text></svg>
