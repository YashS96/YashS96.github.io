<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Each transaction is valid on its snapshot, but together they leave nobody on call" font-size="13"><defs><marker id="skew-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-line)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--dg-ink)">Each is valid on its snapshot; together they leave nobody on call</text><rect x="230" y="60" width="300" height="44" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="380" y="86" text-anchor="middle" font-weight="600" fill="var(--dg-ink)">Start: 2 doctors on call</text><rect x="100" y="136" width="240" height="44" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="220" y="162" text-anchor="middle" fill="var(--dg-ink)">T1 counts on-call: 2</text><rect x="420" y="136" width="240" height="44" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="540" y="162" text-anchor="middle" fill="var(--dg-ink)">T2 counts on-call: 2</text><rect x="100" y="212" width="240" height="44" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="220" y="238" text-anchor="middle" fill="var(--dg-ink)">T1 takes Alice off call</text><rect x="420" y="212" width="240" height="44" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="540" y="238" text-anchor="middle" fill="var(--dg-ink)">T2 takes Bob off call</text><rect x="230" y="308" width="300" height="44" rx="8" fill="var(--dg-bad)" fill-opacity="0.12" stroke="var(--dg-bad)" stroke-width="2"></rect><text x="380" y="334" text-anchor="middle" font-weight="600" fill="var(--dg-ink)">Both commit: 0 on call</text><g fill="none" stroke="var(--dg-line)" stroke-width="1.25"><path d="M380 104V120H220V136" marker-end="url(#skew-arrow)"></path><path d="M380 120H540V136" marker-end="url(#skew-arrow)"></path><path d="M220 180V212" marker-end="url(#skew-arrow)"></path><path d="M540 180V212" marker-end="url(#skew-arrow)"></path><path d="M220 256V330H230" marker-end="url(#skew-arrow)"></path><path d="M540 256V330H530" marker-end="url(#skew-arrow)"></path></g><text x="380" y="288" text-anchor="middle" font-size="11.5" fill="var(--dg-quiet)">different rows, so no lock conflict</text><text x="380" y="380" text-anchor="middle" font-size="11.5" fill="var(--dg-quiet)">Serializable spots the overlap and aborts one with 40001</text></svg>
