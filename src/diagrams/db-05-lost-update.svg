<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Locking the read makes T2 wait for fresh data" font-size="13"><defs><marker id="lost-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-line)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--dg-ink)">Locking the read makes T2 wait for fresh data</text><g fill="none" stroke="var(--dg-line)" stroke-width="1.25"><path d="M194 124V140" marker-end="url(#lost-arrow)"></path><path d="M194 176V192" marker-end="url(#lost-arrow)"></path><path d="M194 228V244" marker-end="url(#lost-arrow)"></path><path d="M194 280V296" marker-end="url(#lost-arrow)"></path><path d="M566 124V140" marker-end="url(#lost-arrow)"></path><path d="M566 176V192" marker-end="url(#lost-arrow)"></path><path d="M566 228V244" marker-end="url(#lost-arrow)"></path><path d="M566 280V296" marker-end="url(#lost-arrow)"></path></g><text x="24" y="72" font-weight="600" fill="var(--dg-ink)">Plain SELECT, then UPDATE</text><rect x="24" y="88" width="340" height="36" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><rect x="24" y="140" width="340" height="36" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><rect x="24" y="192" width="340" height="36" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><rect x="24" y="244" width="340" height="36" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="194" y="111" text-anchor="middle" fill="var(--dg-ink)">T1 reads 100</text><text x="194" y="163" text-anchor="middle" fill="var(--dg-ink)">T2 reads 100</text><text x="194" y="215" text-anchor="middle" fill="var(--dg-ink)">T1 writes 150</text><text x="194" y="267" text-anchor="middle" fill="var(--dg-ink)">T2 writes 120, computed from stale 100</text><rect x="24" y="296" width="340" height="40" rx="8" fill="v