<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 516" role="img" aria-label="A read crosses one boundary and five kernel layers" font-size="13"><defs><marker id="stk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-line)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--dg-ink)">A read() crosses one boundary and five kernel layers</text><g><path d="M140 104V118" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-end="url(#stk-arrow)"></path><path d="M140 164V206" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-end="url(#stk-arrow)"></path><path d="M140 252V266" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-end="url(#stk-arrow)"></path><path d="M140 312V326" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-end="url(#stk-arrow)"></path><path d="M140 372V386" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-end="url(#stk-arrow)"></path><path d="M140 432V446" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-end="url(#stk-arrow)"></path></g><g><rect x="24" y="60" width="712" height="44" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="40" y="86" font-weight="600" fill="var(--dg-ink)">Application</text><text x="260" y="86" font-size="11.5" fill="var(--dg-quiet)">fs.createReadStream(), s3.getObject(), your code</text></g><g><rect x="24" y="120" width="712" height="44" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="40" y="146" font-weight="600" fill="var(--dg-ink)">Runtime (Node / libuv)</text><text x="260" y="146" font-size="11.5" fill="var(--dg-quiet)">Event loop: epoll for sockets, thread pool for files</text></g><g><line x1="24" x2="736" y1="186" y2="186" stroke="var(--dg-line)" stroke-width="1.25" stroke-dasharray="5 4"></line><text x="260" y="180" font-size="11.5" font-weight="600" fill="var(--dg-ink)">syscall boundary: open / read / write</text><text x="736" y="180" text-anchor="end" font-size="11.5" fill="var(--dg-quiet)">user space</text><text x="736" y="200" text-anchor="end" font-size="11.5" fill="var(--dg-quiet)">kernel space</text></g><g><rect x="24" y="208" width="712" height="44" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="40" y="234" font-weight="600" fill="var(--dg-ink)">VFS</text><text x="260" y="234" font-size="11.5" fill="var(--dg-quiet)">One API for every filesystem; path lookup, dentry cache</text></g><g><rect x="24" y="268" width="712" height="44" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="40" y="294" font-weight="600" fill="var(--dg-ink)">Filesystem (ext4, XFS)</text><text x="260" y="294" font-size="11.5" fill="var(--dg-quiet)">Inodes, extents, journal: file offset to block number</text></g><g><rect x="24" y="328" width="712" height="44" rx="8" fill="var(--dg-c1)" fill-opacity="0.12" stroke="var(--dg-c1)" stroke-width="2"></rect><text x="40" y="354" font-weight="600" fill="var(--dg-ink)">Page cache (RAM)</text><text x="260" y="354" font-size="11.5" fill="var(--dg-ink)">Cache hit returns here, no disk I/O at all</text></g><g><rect x="24" y="388" width="712" height="44" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="40" y="414" font-weight="600" fill="var(--dg-ink)">Block layer + driver</text><text x="260" y="414" font-size="11.5" fill="var(--dg-quiet)">Queues, merges and dispatches requests (NVMe, SATA)</text></g><g><rect x="24" y="448" width="712" height="44" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="40" y="474" font-weight="600" fill="var(--dg-ink)">Disk (SSD / HDD)</text><text x="260" y="474" font-size="11.5" fill="var(--dg-quiet)">A flat array of numbered 4 KB blocks, nothing more</text></g></svg>
