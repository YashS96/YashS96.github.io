<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="A PUT is acknowledged only after chunks and index are durable across zones" font-size="13"><defs><marker id="put-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-line)"></path></marker><marker id="put-arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-c1)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--dg-ink)">A PUT returns 200 only after chunks and index are durable across AZs</text><g><line x1="100" x2="100" y1="92" y2="384" stroke="var(--dg-line)" stroke-width="1" stroke-dasharray="4 4"></line><line x1="290" x2="290" y1="92" y2="384" stroke="var(--dg-line)" stroke-width="1" stroke-dasharray="4 4"></line><line x1="480" x2="480" y1="92" y2="384" stroke="var(--dg-line)" stroke-width="1" stroke-dasharray="4 4"></line><line x1="660" x2="660" y1="92" y2="384" stroke="var(--dg-line)" stroke-width="1" stroke-dasharray="4 4"></line></g><g><rect x="24" y="52" width="152" height="40" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="100" y="77" text-anchor="middle" font-weight="600" fill="var(--dg-ink)">SDK client</text></g><g><rect x="214" y="52" width="152" height="40" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="290" y="77" text-anchor="middle" font-weight="600" fill="var(--dg-ink)">Front end</text></g><g><rect x="404" y="52" width="152" height="40" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="480" y="77" text-anchor="middle" font-weight="600" fill="var(--dg-ink)">Storage, 3 AZs</text></g><g><rect x="584" y="52" width="152" height="40" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="660" y="77" text-anchor="middle" font-weight="600" fill="var(--dg-ink)">Metadata index</text></g><g><path d="M100 132H288" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-end="url(#put-arrow)"></path><path d="M290 210H478" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-end="url(#put-arrow)"></path><path d="M480 250H292" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-end="url(#put-arrow)"></path><path d="M290 290H658" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-end="url(#put-arrow)"></path><path d="M660 330H292" fill="none" stroke="var(--dg-line)" stroke-width="1.25" marker-end="url(#put-arrow)"></path><path d="M290 370H102" fill="none" stroke="var(--dg-c1)" stroke-width="2" marker-end="url(#put-arrow-a)"></path></g><text x="195" y="124" text-anchor="middle" font-size="11.5" fill="var(--dg-ink)">1. PUT key (TLS, SigV4)</text><text x="300" y="166" font-size="11.5" fill="var(--dg-ink)">2. auth check, then</text><text x="300" y="182" font-size="11.5" fill="var(--dg-ink)">erasure-code into chunks</text><text x="385" y="202" text-anchor="middle" font-size="11.5" fill="var(--dg-ink)">3. write chunks, 3 AZs</text><text x="385" y="242" text-anchor="middle" font-size="11.5" fill="var(--dg-ink)">4. quorum of durable acks</text><text x="488" y="282" font-size="11.5" fill="var(--dg-ink)">5. commit key to chunks</text><text x="488" y="322" font-size="11.5" fill="var(--dg-ink)">6. committed, replicated</text><text x="195" y="362" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--dg-ink)">7. 200 OK + ETag</text><text x="24" y="408" font-size="11.5" fill="var(--dg-quiet)">Any failure before step 6: no 200, readers keep seeing the old version. Orphaned chunks are garbage-collected.</text></svg>
