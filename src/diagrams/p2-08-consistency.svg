<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" role="img" aria-label="Overwrite is new chunks plus one atomic index flip; a witness keeps caches honest" font-size="13"><defs><marker id="cs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-line)"></path></marker><marker id="cs-arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-c1)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--dg-ink)">Overwrite = new chunks + one atomic index flip; a witness keeps caches honest</text><g fill="none" stroke-width="1.25"><path d="M200 116V156H114V194" stroke="var(--dg-line)" stroke-dasharray="4 4" marker-end="url(#cs-arrow)"></path><path d="M264 116V156H346V194" stroke="var(--dg-c1)" stroke-width="2" marker-end="url(#cs-arrow-a)"></path><path d="M114 278V254" stroke="var(--dg-line)" marker-end="url(#cs-arrow)"></path><path d="M608 124V194" stroke="var(--dg-line)" marker-start="url(#cs-arrow)" marker-end="url(#cs-arrow)"></path></g><text x="120" y="148" font-size="11.5" fill="var(--dg-quiet)">before</text><text x="282" y="148" font-size="11.5" fill="var(--dg-ink)">after atomic flip</text><text x="618" y="164" font-size="11.5" fill="var(--dg-quiet)">is v1 current?</text><g><rect x="132" y="60" width="200" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="148" y="84" font-weight="600" fill="var(--dg-ink)">Index: report.pdf</text><text x="148" y="102" font-size="11.5" fill="var(--dg-quiet)">one pointer, swapped once</text></g><g><rect x="24" y="196" width="180" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="40" y="220" font-weight="600" fill="var(--dg-ink)">v1 chunks (old)</text><text x="40" y="238" font-size="11.5" fill="var(--dg-quiet)">stay on disk until GC</text></g><g><rect x="252" y="196" width="188" height="56" rx="8" fill="var(--dg-c1)" fill-opacity="0.12" stroke="var(--dg-c1)" stroke-width="2"></rect><text x="268" y="220" font-weight="600" fill="var(--dg-ink)">v2 chunks (new)</text><text x="268" y="238" font-size="11.5" fill="var(--dg-ink)">durable before the flip</text></g><g><rect x="24" y="280" width="180" height="44" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="114" y="306" text-anchor="middle" font-size="11.5" fill="var(--dg-ink)">Reader mid-stream: full v1</text></g><g><rect x="480" y="60" width="256" height="64" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="496" y="84" font-weight="600" fill="var(--dg-ink)">Front-end index cache</text><text x="496" y="102" font-size="11.5" fill="var(--dg-quiet)">holds report.pdf to v1</text><text x="496" y="116" font-size="11.5" fill="var(--dg-quiet)">fast, but could be stale</text></g><g><rect x="480" y="196" width="256" height="64" rx="8" fill="var(--dg-c1)" fill-opacity="0.12" stroke="var(--dg-c1)" stroke-width="2"></rect><text x="496" y="220" font-weight="600" fill="var(--dg-ink)">Witness</text><text x="496" y="238" font-size="11.5" fill="var(--dg-ink)">tracks latest change per key</text><text x="496" y="252" font-size="11.5" fill="var(--dg-ink)">stale? cache refetches the row</text></g><text x="480" y="300" font-size="11.5" fill="var(--dg-ink)">Result: after a PUT returns, every</text><text x="480" y="316" font-size="11.5" fill="var(--dg-ink)">read in the region sees v2.</text></svg>
