<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" role="img" aria-label="The index is split by sorted key range and every range is replicated across AZs" font-size="13"><defs><marker id="ix-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-line)"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="var(--dg-ink)">The index is split by sorted key range; every range is replicated across AZs</text><text x="24" y="54" font-size="11.5" fill="var(--dg-quiet)">bucket + key, sorted lexicographically</text><g><rect x="24" y="64" width="172" height="40" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="110" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink)">a... to f...</text></g><g><rect x="204" y="64" width="172" height="40" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="290" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink)">g... to 2026-09...</text></g><g><rect x="384" y="64" width="172" height="40" rx="8" fill="var(--dg-warn)" fill-opacity="0.14" stroke="var(--dg-warn)" stroke-width="2"></rect><text x="470" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="var(--dg-ink)">2026-10-17/... (hot)</text></g><g><rect x="564" y="64" width="172" height="40" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="650" y="88" text-anchor="middle" font-size="12" fill="var(--dg-ink)">2026-10-18... to z...</text></g><g><g><rect x="24" y="136" width="172" height="52" rx="8" fill="var(--dg-tint)" stroke="var(--dg-line)" stroke-width="1"></rect><rect x="34" y="146" width="46" height="32" rx="6" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><rect x="87" y="146" width="46" height="32" rx="6" fill="none" stroke="var(--dg-line)" stroke-width="1.25">