th></g><text x="57" y="166" text-anchor="middle" font-size="11" fill="var(--dg-ink)">AZ1</text><text x="110" y="166" text-anchor="middle" font-size="11" fill="var(--dg-ink)">AZ2</text><text x="163" y="166" text-anchor="middle" font-size="11" fill="var(--dg-ink)">AZ3</text><text x="237" y="166" text-anchor="middle" font-size="11" fill="var(--dg-ink)">AZ1</text><text x="290" y="166" text-anchor="middle" font-size="11" fill="var(--dg-ink)">AZ2</text><text x="343" y="166" text-anchor="middle" font-size="11" fill="var(--dg-ink)">AZ3</text><text x="417" y="166" text-anchor="middle" font-size="11" fill="var(--dg-ink)">AZ1</text><text x="470" y="166" text-anchor="middle" font-size="11" fill="var(--dg-ink)">AZ2</text><text x="523" y="166" text-anchor="middle" font-size="11" fill="var(--dg-ink)">AZ3</text><text x="597" y="166" text-anchor="middle" font-size="11" fill="var(--dg-ink)">AZ1</text><text x="650" y="166" text-anchor="middle" font-size="11" fill="var(--dg-ink)">AZ2</text><text x="703" y="166" text-anchor="middle" font-size="11" fill="var(--dg-ink)">AZ3</text></g><text x="24" y="210" font-size="11.5" fill="var(--dg-quiet)">Each range: 3 replicas kept in sync by quorum / consensus. Lose one, another serves.</text><g><rect x="24" y="222" width="712" height="56" rx="8" fill="var(--dg-warn)" fill-opacity="0.10" stroke="var(--dg-warn)" stroke-width="1.5"></rect><text x="40" y="244" font-weight="600" fill="var(--dg-ink)">Hot range: date-first keys all sort here, so writes hit 503 Slow Down</text><text x="40" y="264" font-size="11.5" fill="var(--dg-ink)">S3 auto-splits it over time. Faster fix: vary the prefix (server-1/2026-10-17/..., or a hash) and batch.</text></g></svg>
