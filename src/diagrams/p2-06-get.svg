<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Big reads are many small parallel range reads, streamed with backpressure" font-size="13"><defs><marker id="get-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-line)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--dg-ink)">A 10 GB GET is many parallel range reads, streamed with backpressure</text><g fill="none" stroke="var(--dg-line)" stroke-width="1.25"><path d="M192 76H230" marker-end="url(#get-arrow)"></path><path d="M192 120H230" marker-end="url(#get-arrow)"></path><path d="M192 164H230" marker-end="url(#get-arrow)"></path><path d="M408 76H446" marker-end="url(#get-arrow)"></path><path d="M408 120H446" marker-end="url(#get-arrow)"></path><path d="M408 164H446" marker-end="url(#get-arrow)"></path><path d="M108 184V226" marker-end="url(#get-arrow)"></path></g><g><rect x="24" y="60" width="168" height="124" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="40" y="84" font-weight="600" fill="var(--dg-ink)">SDK / transfer mgr</text><text x="40" y="104" font-size="11.5" fill="var(--dg-quiet)">split into byte ranges</text><text x="40" y="120" font-size="11.5" fill="var(--dg-quiet)">N pooled connections</text><text x="40" y="136" font-size="11.5" fill="var(--dg-quiet)">retry a failed range</text><text x="40" y="152" font-size="11.5" fill="var(--dg-quiet)">reassemble in order</text></g><g><rect x="232" y="60" width="176" height="32" rx="6" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><rect x="232" y="104" width="176" height="32" rx="6" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><rect x="232" y="148" width="176" height="32" rx="6" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="244" y="80" font-size="11.5" fill="var(--dg-ink)">Range: bytes 0 to 8 MB</text><text x="244" y="124" font-size="11.5" fill="var(--dg-ink)">Range: bytes 8 to 16 MB</text><text x="244" y="168" font-size="11.5" fill="var(--dg-ink)">Range: 16 to 24 MB, ...</text></g><g><rect x="448" y="60" width="288" height="124" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="464" y="84" font-weight="600" fill="var(--dg-ink)">S3, per range, any front end</text><text x="464" y="104" font-size="11.5" fill="var(--dg-quiet)">index lookup (cached, witness-checked)</text><text x="464" y="120" font-size="11.5" fill="var(--dg-quiet)">read data chunks directly, no maths</text><text x="464" y="136" font-size="11.5" fill="var(--dg-quiet)">disk slow or dead: decode from parity</text><text x="464" y="152" font-size="11.5" fill="var(--dg-quiet)">or hedge the request to another node</text></g><g><rect x="24" y="228" width="712" height="48" rx="8" fill="var(--dg-c1)" fill-opacity="0.12" stroke="var(--dg-c1)" stroke-width="2"></rect><text x="40" y="250" font-weight="600" fill="var(--dg-ink)">Readable stream to your code</text><text x="40" y="266" font-size="11.5" fill="var(--dg-ink)">Consumer slow? The SDK stops requesting ranges: backpressure, flat memory, 10 GB never in RAM</text></g></svg>
