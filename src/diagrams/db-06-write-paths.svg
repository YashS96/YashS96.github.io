<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" role="img" aria-label="Every write path goes through one data access layer" font-size="13"><defs><marker id="dal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-line)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--dg-ink)">Every write path goes through one data access layer</text><rect x="24" y="64" width="160" height="40" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="104" y="88" text-anchor="middle" fill="var(--dg-ink)">Inbound sync</text><rect x="24" y="108" width="160" height="40" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="104" y="132" text-anchor="middle" fill="var(--dg-ink)">Bulk uploads</text><rect x="24" y="152" width="160" height="40" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="104" y="176" text-anchor="middle" fill="var(--dg-ink)">User APIs</text><rect x="24" y="196" width="160" height="40" rx="8" fill="none" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="104" y="220" text-anchor="middle" fill="var(--dg-ink)">Admin overrides</text><rect x="248" y="60" width="280" height="180" rx="8" fill="var(--dg-c1)" fill-opacity="0.12" stroke="var(--dg-c1)" stroke-width="2"></rect><text x="264" y="84" font-weight="600" fill="var(--dg-ink)">Data access layer</text><text x="264" y="108" font-size="11.5" fill="var(--dg-ink)">writeOne() and writeBatch()</text><text x="264" y="132" font-size="11.5" fill="var(--dg-ink)">FOR UPDATE, or one atomic UPDATE</text><text x="264" y="156" font-size="11.5" fill="var(--dg-ink)">Lock rows ORDER BY id</text><text x="264" y="180" font-size="11.5" fill="var(--dg-ink)">Short tx, no external calls</text><text x="264" y="204" font-size="11.5" fill="var(--dg-ink)">withRetry on 40001 and 40P01</text><rect x="592" y="