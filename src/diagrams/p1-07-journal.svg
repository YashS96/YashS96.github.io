<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" role="img" aria-label="Log first, apply second: a crash at any point leaves a consistent disk" font-size="13"><defs><marker id="wal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-line)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--dg-ink)">Log first, apply second: a crash at any point leaves a consistent disk</text><g fill="none" stroke="var(--dg-line)" stroke-width="1.25"><path d="M184 88H206" marker-end="url(#wal-arrow)"></path><path d="M368 88H390" marker-end="url(#wal-arrow)"></path><path d="M552 88H574" marker-end="url(#wal-arrow)"></path><path d="M196 116V174" stroke-dasharray="4 4" marker-end="url(#wal-arrow)"></path><path d="M564 116V174" stroke-dasharray="4 4" marker-end="url(#wal-arrow)"></path></g><g><rect x="24" y="60" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="40" y="84" font-weight="600" fill="var(--dg-ink)">1. Log the intent</text><text x="40" y="102" font-size="11.5" fill="var(--dg-quiet)">append to the journal</text></g><g><rect x="208" y="60" width="160" height="56" rx="8" fill="var(--dg-c1)" fill-opacity="0.12" stroke="var(--dg-c1)" stroke-width="2"></rect><text x="224" y="84" font-weight="600" fill="var(--dg-ink)">2. Commit record</text><text x="224" y="102" font-size="11.5" fill="var(--dg-ink)">checksum, flushed to disk</text></g><g><rect x="392" y="60" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="408" y="84" font-weight="600" fill="var(--dg-ink)">3. Apply changes</text><text x="408" y="102" font-size="11.5" fill="var(--dg-quiet)">inodes, bitmaps, data</text></g><g><rect x="576" y="60" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--dg-line)" stroke-width="1.25"></rect><text x="592" y="84" font-weight="600" fill="var(--dg-ink)">4. Checkpoint</text><text x="592" y="102" font-size="11.5" fill="var(--dg-quiet)">free the journal space</text></g><text x="204" y="150" font-size="11.5" fill="var(--dg-quiet)">crash here</text><text x="572" y="150" font-size="11.5" fill="var(--dg-quiet)">crash here</text><g><rect x="24" y="176" width="344" height="72" rx="8" fill="var(--dg-warn)" fill-opacity="0.12" stroke="var(--dg-warn)" stroke-width="1.5"></rect><text x="40" y="200" font-weight="600" fill="var(--dg-ink)">Before commit: discard</text><text x="40" y="218" font-size="11.5" fill="var(--dg-ink)">No valid commit record, so the note is ignored</text><text x="40" y="234" font-size="11.5" fill="var(--dg-ink)">Real structures untouched: as if it never happened</text></g><g><rect x="392" y="176" width="344" height="72" rx="8" fill="var(--dg-good)" fill-opacity="0.12" stroke="var(--dg-good)" stroke-width="1.5"></rect><text x="408" y="200" font-weight="600" fill="var(--dg-ink)">After commit: replay (roll-forward)</text><text x="408" y="218" font-size="11.5" fill="var(--dg-ink)">Boot reads the journal and finishes the job</text><text x="408" y="234" font-size="11.5" fill="var(--dg-ink)">Idempotent: the note holds final values</text></g></svg>
